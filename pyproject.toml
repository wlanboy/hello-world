[project]
name = "hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wlanboy", email = "wlanboy@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hello-world = "hello_world.server:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
