{{- if and (eq .Values.ingress.controller "istio") (.Capabilities.APIVersions.Has "networking.istio.io/v1beta1") }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.istio.gatewayName }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
      {{- range .Values.ingress.hosts }}
        - {{ . }}
      {{- end }}
{{- end }}
